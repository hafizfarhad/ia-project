# Detection thresholds (SPEC.md §4). Durations are in simulated time.
S1_structuring:
  window_days: 7
  min_count: 3
  band_low: 0.85        # fraction of the tier daily limit
  band_high: 1.00
  score: 0.7

S2_fan_in_out:
  window_hours: 24
  min_distinct_senders: 8
  min_distinct_receivers: 5
  min_out_in_ratio: 0.80
  score: 0.7

S3_pass_through:
  min_incoming: 20000
  forward_ratio: 0.90
  forward_within_minutes: 60
  min_occurrences: 2
  occurrence_window_days: 7
  score: 0.7

S4_layering_chain:
  min_hops: 4
  window_hours: 6
  hop_ratio_low: 0.85
  hop_ratio_high: 1.00
  score: 0.9

S5_round_trip:
  min_cycle_len: 3
  max_cycle_len: 6
  window_hours: 72
  min_return_ratio: 0.70
  score: 0.9

S6_shared_device:
  min_wallets: 3
  window_days: 7
  score: 0.7

ML:
  threshold: 0.80

case_priority:
  multi_scenario_bonus: 0.05   # added per extra distinct scenario on the same case, capped at 1.0

graph_worker:
  interval_seconds: 5
